name: Release

# Push a tag like v0.1.0 to publish that version to npm.
# Auth uses npm trusted publishing (OIDC): the workflow exchanges a short-lived
# GitHub Actions identity token for a publish token, so no NPM_TOKEN secret is
# stored anywhere. npm also attaches a provenance attestation automatically.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  # Mints the OIDC token that npm exchanges for a publish token.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm 11.5.1 or later; fail loudly instead of
      # letting the publish step report a confusing 404.
      - name: Require npm with trusted publishing support
        run: |
          node -e '
            const { execFileSync } = require("node:child_process");
            const raw = execFileSync("npm", ["--version"]).toString().trim();
            const [major, minor, patch] = raw.split(".").map(Number);
            const tooOld =
              major < 11 ||
              (major === 11 && minor < 5) ||
              (major === 11 && minor === 5 && patch < 1);
            if (tooOld) {
              console.error(`::error::npm ${raw} cannot publish with OIDC, need >= 11.5.1; bump node-version or run npm install -g npm@latest`);
              process.exit(1);
            }
            console.log(`npm ${raw} supports trusted publishing`);
          '

      - name: Check tag matches package version
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match package version ${version}"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Verify
        run: |
          npm run verify
          # Confirms the published file set before the irreversible step.
          npm pack --dry-run

      - name: Publish to npm
        run: npm publish
